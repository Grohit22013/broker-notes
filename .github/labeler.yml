# actions/labeler v5 config — labels applied automatically to PRs.

# ── Phase labels from the branch name (phase-N/…) ──
phase-0:
  - head-branch: ["^phase-0/"]
phase-1:
  - head-branch: ["^phase-1/"]
phase-2:
  - head-branch: ["^phase-2/"]
phase-3:
  - head-branch: ["^phase-3/"]
phase-4:
  - head-branch: ["^phase-4/"]
phase-5:
  - head-branch: ["^phase-5/"]
phase-6:
  - head-branch: ["^phase-6/"]
phase-7:
  - head-branch: ["^phase-7/"]
phase-8:
  - head-branch: ["^phase-8/"]

# ── Area labels from the files changed ──
"area: ci":
  - changed-files:
      - any-glob-to-any-file: [".github/**", ".husky/**"]
"area: ui":
  - changed-files:
      - any-glob-to-any-file:
          ["apps/web/components/**", "apps/web/app/**/*.tsx", "apps/web/app/globals.css"]
"area: api":
  - changed-files:
      - any-glob-to-any-file: ["apps/api/src/**", "apps/api/test/**"]
"area: db":
  - changed-files:
      - any-glob-to-any-file: ["apps/api/prisma/**", "apps/api/src/prisma/**"]
"area: auth":
  - changed-files:
      - any-glob-to-any-file:
          [
            "apps/api/src/auth/**",
            "apps/web/middleware.ts",
            "apps/web/app/(auth)/**",
            "apps/web/lib/auth/**",
          ]
"area: ai":
  - changed-files:
      - any-glob-to-any-file: ["**/ai/**", "**/*redact*"]
"area: editor":
  - changed-files:
      - any-glob-to-any-file: ["apps/web/components/editor/**"]
dependencies:
  - changed-files:
      - any-glob-to-any-file: ["**/package.json", "package-lock.json"]
