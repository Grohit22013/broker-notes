# ──────────────────────────────────────────────────────────────────────────────
# CI pipeline for the BrokerNotes monorepo
#   apps/web (Next.js) · apps/api (NestJS) · packages/shared
#
#   lint ─┐
#   format ┤
#   typecheck ┤
#   unit-tests ┤   (shared + web: Vitest w/ coverage · api: Jest)
#   database ┼──► ✅ CI passed  (single required status check)
#   api-integration ┤  (NestJS app over HTTP against Postgres 17)
#   build ┤
#   e2e ─┘   (Playwright, desktop + mobile, API + web + Postgres)
# ──────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  NEXT_TELEMETRY_DISABLED: 1
  # CI-only values (no real secrets). The API and web app must share AUTH_SECRET.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/brokernotes_ci
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/brokernotes_ci
  AUTH_SECRET: ci-only-not-a-real-secret-0123456789
  API_URL: http://localhost:4000

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint (all workspaces)
        run: npx eslint . --max-warnings=0
      - name: Summary
        if: success()
        run: echo "### 🔍 Lint — ✅ no ESLint errors or warnings (web, api, shared)" >> "$GITHUB_STEP_SUMMARY"

  format:
    name: 🎨 Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prettier check
        run: |
          if ! npx prettier --check . > prettier.log 2>&1; then
            {
              echo "### 🎨 Format — ❌ files need formatting"
              echo "Run \`npm run format\` locally and commit."
              echo '```'
              grep '\[warn\]' prettier.log | grep -v 'Code style issues' || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            cat prettier.log
            exit 1
          fi
          echo "### 🎨 Format — ✅ all files match Prettier style" >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: 🔷 Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci # api postinstall runs `prisma generate`
      - name: tsc --noEmit (shared → api → web)
        run: npm run typecheck
      - name: Summary
        if: success()
        run: echo "### 🔷 Typecheck — ✅ no TypeScript errors in web, api or shared (strict mode)" >> "$GITHUB_STEP_SUMMARY"

  unit-tests:
    name: 🧪 Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:shared # web tests import the compiled shared package
      - name: packages/shared (Vitest, coverage enforced)
        run: npm run test:coverage -w @broker-notes/shared
      - name: apps/web (Vitest, coverage enforced)
        run: npm run test:coverage -w @broker-notes/web
      - name: apps/api (Jest)
        run: npm test -w @broker-notes/api
      - name: Summary
        if: always()
        run: |
          node .github/scripts/test-summary.cjs "🧪 shared" packages/shared/reports/junit.xml packages/shared/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          node .github/scripts/test-summary.cjs "🧪 web" apps/web/reports/junit.xml apps/web/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

  database:
    name: 🗄️ Database schema & migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brokernotes_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Validate schema
        run: npx prisma validate
      - name: Check schema formatting
        run: npx prisma format --check
      - name: Apply all migrations to a fresh database
        run: npx prisma migrate deploy
      - name: Detect drift (schema.prisma changed without a migration)
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
            && echo "No drift" \
            || { echo "::error file=apps/api/prisma/schema.prisma::schema.prisma has changes not captured in a migration. Run \`npm run db:migrate\`."; exit 1; }
      - name: Summary
        if: always()
        run: |
          count=$(ls -d prisma/migrations/*/ 2>/dev/null | wc -l | tr -d ' ')
          {
            echo "### 🗄️ Database — ${{ job.status == 'success' && '✅' || '❌' }}"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Postgres | 17 (service container) |"
            echo "| Migrations applied | ${count} |"
            echo "| Schema valid & formatted | ${{ job.status == 'success' && '✅' || 'see logs' }} |"
            echo "| Drift vs. migrations | ${{ job.status == 'success' && '✅ none' || 'see logs' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  api-integration:
    name: 🔌 API integration (NestJS + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brokernotes_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - name: Apply migrations
        run: npm run db:deploy -w @broker-notes/api
      - name: Integration tests (auth, isolation, notes, finalise, clients, CSV)
        run: npm run test:int -w @broker-notes/api 2>&1 | tee int.log; exit ${PIPESTATUS[0]}
      - name: Summary
        if: always()
        run: |
          line=$(grep -E "^Tests:" int.log | tail -1)
          if grep -qE "failed" <<<"$line"; then icon="❌"; else icon="✅"; fi
          echo "### 🔌 API integration — ${icon} ${line#Tests: }" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'apps/web/**/*.css', 'packages/shared/src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build shared → api → web
        run: npm run build 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Bundle size summary
        if: success()
        run: |
          {
            echo "### 🏗️ Build — ✅ shared, api (NestJS) and web (Next.js) built"
            echo ""
            echo "**Web routes & bundle sizes**"
            echo '```'
            sed -n '/^Route (app)/,/^$/p' build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: 🎭 E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brokernotes_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npm run db:deploy -w @broker-notes/api
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Build shared → api → web
        run: npm run build
      - name: Run E2E tests (starts API + web)
        run: npm run test:e2e
      - name: E2E summary
        if: always()
        run: node .github/scripts/e2e-summary.cjs apps/web/reports/e2e.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  ci-passed:
    name: ✅ CI passed
    if: always()
    needs: [lint, format, typecheck, unit-tests, database, api-integration, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report & verify all jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const needs = JSON.parse(process.env.RESULTS);
          const icon = { success: "✅", failure: "❌", cancelled: "⏹️", skipped: "⏭️" };
          console.log("## CI result\n\n| Job | Result |\n|---|---|");
          for (const [job, { result }] of Object.entries(needs)) console.log(`| ${job} | ${icon[result] ?? result} ${result} |`);
          EOF
          echo "$RESULTS" | grep -Eq '"result": "(failure|cancelled)"' && { echo "::error::One or more CI jobs failed"; exit 1; } || echo "All CI jobs passed"
