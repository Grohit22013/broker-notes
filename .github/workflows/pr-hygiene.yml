# ──────────────────────────────────────────────────────────────────────────────
# PR hygiene
#   • Title check — "Phase N: …" for phase PRs, Conventional Commits otherwise
#   • Auto-label  — phase-N from the branch name, area: * from changed files
#   • Size label  — size/XS … size/XL from lines changed
# ──────────────────────────────────────────────────────────────────────────────
name: PR hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: 📝 PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
        run: |
          phase_re='^Phase [0-9]+: .{5,}$'
          conv_re='^(feat|fix|chore|docs|refactor|perf|test|ci|build|style|revert)(\([a-z0-9-]+\))?!?: .{3,}$'
          if [[ "$BRANCH" =~ ^phase-([0-9]+)/ ]]; then
            n="${BASH_REMATCH[1]}"
            if [[ ! "$TITLE" =~ ^Phase\ $n:\  ]]; then
              echo "::error::Branch '$BRANCH' is a phase branch, so the PR title must start with 'Phase $n: ' (got: '$TITLE')"
              exit 1
            fi
          elif [[ ! "$TITLE" =~ $phase_re && ! "$TITLE" =~ $conv_re ]]; then
            echo "::error::PR title must be 'Phase N: …' or Conventional Commits, e.g. 'fix(editor): autosave race' (got: '$TITLE')"
            exit 1
          fi
          echo "### 📝 PR title — ✅ \`$TITLE\`" >> "$GITHUB_STEP_SUMMARY"

  label:
    name: 🏷️ Auto-label
    # Fork PRs get a read-only token; skip labelling there instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: false
      - name: Size label
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const changed = pr.additions + pr.deletions;
            const sizes = [["size/XS", 10], ["size/S", 100], ["size/M", 400], ["size/L", 1000], ["size/XL", Infinity]];
            const [label] = sizes.find(([, max]) => changed <= max);
            const { owner, repo } = context.repo;
            for (const [name] of sizes) {
              if (name !== label && pr.labels.some((l) => l.name === name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name });
              }
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [label] });
            core.summary.addRaw(`### 🏷️ Labels — ${label} (${changed} lines changed)`).write();
