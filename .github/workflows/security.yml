# ──────────────────────────────────────────────────────────────────────────────
# Security checks
#   • Dependency review — blocks PRs that ADD vulnerable or copyleft dependencies
#   • npm audit         — reports known vulnerabilities in the full dependency tree
#   • CodeQL            — static analysis of our TypeScript for security bugs
# ──────────────────────────────────────────────────────────────────────────────
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: 📦 Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: on-failure

  npm-audit:
    name: 🛡️ npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      # Report-only: known issues are tracked in SCRATCHPAD.md. Critical vulns fail the job.
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --json > audit.json || true
          node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const a = require("./audit.json");
          const v = a.metadata?.vulnerabilities ?? {};
          console.log("### 🛡️ npm audit (production deps)\n\n| Severity | Count |\n|---|---|");
          for (const s of ["critical", "high", "moderate", "low"]) console.log(`| ${s} | ${v[s] ?? 0} |`);
          const pkgs = Object.values(a.vulnerabilities ?? {}).map((x) => `- \`${x.name}\` (${x.severity}) via ${[].concat(x.via).map((y) => typeof y === "string" ? y : y.title).join("; ")}`);
          if (pkgs.length) console.log("\n**Affected packages**\n" + pkgs.join("\n"));
          EOF
          npm audit --omit=dev --audit-level=critical

  codeql:
    name: 🔬 CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
